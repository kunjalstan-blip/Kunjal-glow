<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Skin">
<title>My Skin · Kunjal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F7; --surf:#FFFFFF; --surf2:#F2F2F7; --ink:#111318; --body:#3C3F48; --muted:#8A8D97; --line:rgba(17,19,24,.08);
  --am1:#FDBA4D; --am2:#F2762E; --amt:#FFF3E6; --amd:#B4520E;
  --pm1:#7C83FF; --pm2:#4338CA; --pmt:#EEF0FF; --pmd:#3730A3; --acc:#4338CA;
  --gr:#16A34A; --grt:#E8F7EE; --grd:#166534;
  --rd:#E5484D; --rdt:#FDECEC; --rdd:#9F1D21;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 6px 20px rgba(16,24,40,.05);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  --disp: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --surf:#1C1C1E; --surf2:#2C2C2E; --ink:#F5F5F7; --body:#D1D1D6; --muted:#8E8E93; --line:rgba(255,255,255,.1);
    --amt:#3A2410; --amd:#FDBA74; --pmt:#1E1B4B; --pmd:#C7D2FE; --acc:#8B92FF; --grt:#0E2A19; --grd:#86EFAC; --rdt:#3B1214; --rdd:#FCA5A5;
    --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;letter-spacing:inherit}
input{font:inherit}
h1,h2,h3{font-family:var(--disp);margin:0;letter-spacing:-.02em}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(10px + var(--safe-t)) 16px calc(96px + var(--safe-b))}
/* header */
.hd{display:flex;align-items:flex-end;gap:12px;padding:8px 4px 14px}
.hd .t{flex:1;min-width:0}
.hd small{display:block;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.hd h1{font-size:31px;font-weight:800;line-height:1.1;margin-top:2px}
.streak{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:14px;padding:8px 12px;border-radius:999px;background:var(--surf);box-shadow:var(--shadow);flex:none}
/* week strip */
.week{background:var(--surf);border-radius:22px;padding:10px 6px 10px;box-shadow:var(--shadow);margin-bottom:14px}
.weekhd{display:flex;align-items:center;justify-content:space-between;padding:0 6px 6px 10px}
.weekhd b{font-size:15px;font-weight:700}
.weekhd span{font-size:13px;color:var(--muted);font-weight:600}
.weekhd .nav{display:flex;gap:6px}
.ib{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surf2);color:var(--ink);flex:none}
.ib:disabled{opacity:.3}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0 6px;border-radius:16px;font-weight:600}
.dp small{font-size:11px;color:var(--muted);font-weight:700}
.dp .rg{position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.dp .rg svg{position:absolute;inset:0}
.dp.sel{background:var(--ink);color:var(--bg)}
.dp.sel small{color:var(--bg);opacity:.7}
.dp.fut{opacity:.55}
.dp.sel.fut{opacity:1}
.dp.today:not(.sel) .rg,.dp.today:not(.sel) small{color:var(--acc)}
/* segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(118,118,128,.12);border-radius:14px;padding:3px;margin-bottom:14px}
.seg button{display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 0;border-radius:11px;font-weight:700;font-size:15px;color:var(--body)}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg i{font-style:normal;font-size:12px;font-weight:700;color:var(--muted);background:rgba(118,118,128,.14);padding:1px 7px;border-radius:999px}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px;color:#fff;margin-bottom:14px}
.hero.am{background:linear-gradient(135deg,var(--am1),var(--am2))}
.hero.pm{background:linear-gradient(135deg,var(--pm1),var(--pm2))}
.hero.done{background:linear-gradient(135deg,#4ADE80,#15803D)}
.hero::after{content:"";position:absolute;right:-40px;top:-50px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.13)}
.hrow{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.hero .lbl{font-size:12.5px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.hero h2{font-size:24px;font-weight:800;line-height:1.15;margin:3px 0 8px}
.hero .tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700}
.hero .cta{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:16px;padding:14px;border-radius:16px;background:#fff;font-weight:800;font-size:16px}
.hero.am .cta{color:#D9601A} .hero.pm .cta{color:#4338CA} .hero.done .cta{color:#15803D}
.nudge{display:flex;align-items:center;gap:10px;border-radius:16px;padding:12px 14px;margin-bottom:12px;font-weight:600;font-size:14.5px;line-height:1.4;background:var(--surf);box-shadow:var(--shadow)}
.nudge svg{flex:none}
/* chips */
.pills{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;padding:9px 14px 9px 10px;border-radius:999px;background:var(--surf);box-shadow:var(--shadow);font-weight:700;font-size:14px;color:var(--body)}
.pill .dot{width:20px;height:20px;border-radius:50%;border:2px solid #C7C7CC;display:flex;align-items:center;justify-content:center}
.pill.on{background:var(--ink);color:var(--bg)}
.pill.on .dot{border-color:var(--gr);background:var(--gr)}
.pill.on .dot::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:14px;font-weight:600;line-height:1.45}
.note svg{flex:0 0 20px;margin-top:1px}
/* list */
.list{background:var(--surf);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.item{display:flex;align-items:center;gap:12px;padding:11px 10px 11px 14px;position:relative}
.item + .item::before{content:"";position:absolute;left:120px;right:0;top:0;height:1px;background:var(--line)}
.chk{flex:0 0 30px;width:30px;height:30px;border-radius:50%;border:2.2px solid #C7C7CC;display:flex;align-items:center;justify-content:center;transition:all .2s}
.am-c .chk{border-color:var(--am1)} .pm-c .chk{border-color:var(--pm1)}
.item.done .chk{background:var(--gr);border-color:var(--gr)}
.chk svg{opacity:0;transform:scale(.5);transition:all .2s}
.item.done .chk svg{opacity:1;transform:scale(1)}
.chk:active{transform:scale(.88)}
.chk.lock{opacity:.35;border-style:dashed}
.th{flex:0 0 52px;width:52px;height:52px;border-radius:14px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,.06)}
.th img{width:100%;height:100%;object-fit:contain}
.th .sv{height:46px;width:auto}
.it{flex:1;min-width:0;text-align:left}
.it small{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.am-c .it small{color:var(--amd)} .pm-c .it small{color:var(--pmd)}
.it b{display:block;font-size:15.5px;font-weight:600;line-height:1.25;margin:2px 0 1px}
.it span{font-size:13px;color:var(--muted);font-weight:500}
.item.done .it b{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(138,141,151,.6)}
.item.done .th{opacity:.55}
.opt{font-size:10.5px;font-weight:700;color:var(--muted);background:var(--surf2);padding:2px 7px;border-radius:999px;text-transform:none;letter-spacing:0}
.star{font-size:10px;font-weight:800;color:#fff;background:var(--am2);padding:2px 7px;border-radius:999px;letter-spacing:.04em}
.pm-c .star{background:var(--pm2)}
.chev{color:#C7C7CC;flex:none}
.card{background:var(--surf);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h3{font-size:17px;font-weight:700;margin-bottom:5px}
.card p{margin:0;font-size:14.5px;color:var(--body);line-height:1.45;font-weight:500}
.coming{display:flex;gap:12px;align-items:center}
.coming .th{flex:0 0 48px;width:48px;height:48px}
.coming b{display:block;font-size:12px;font-weight:800;color:var(--gr);text-transform:uppercase;letter-spacing:.04em}
.coming span{font-size:15px;font-weight:600;line-height:1.3}
.sech{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:20px 6px 8px}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:rgba(249,249,251,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);padding:6px 8px calc(4px + var(--safe-b));display:flex;justify-content:center}
@media (prefers-color-scheme: dark){ .tabs{background:rgba(22,22,24,.82)} }
.tabs .in{display:flex;max-width:560px;width:100%}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:11px;font-weight:600;color:var(--muted)}
.tabs button.on{color:var(--acc)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--bg);border-radius:28px 28px 0 0;max-height:93vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.85,.25,1), visibility 0s .35s;padding:0 16px calc(20px + var(--safe-b))}
.sheet.on{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.85,.25,1)}
.grab{width:38px;height:5px;border-radius:9px;background:rgba(120,120,128,.35);margin:9px auto 8px}
.x{position:absolute;right:16px;top:16px;width:32px;height:32px;border-radius:50%;background:rgba(118,118,128,.16);display:flex;align-items:center;justify-content:center;color:var(--muted);z-index:2}
/* product block (sheet + guided mode) */
.prod{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 4px}
.ph{width:176px;height:176px;border-radius:32px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.05)}
.ph img{width:100%;height:100%;object-fit:contain}
.ph .sv{height:148px;width:auto}
.prod small{display:block;margin-top:16px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.prod h2{font-size:24px;font-weight:800;line-height:1.2;margin:4px 12px 10px}
.amtp{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;background:var(--surf);box-shadow:var(--shadow)}
.does{font-size:16px;line-height:1.5;color:var(--body);font-weight:500;margin:14px 6px 4px;text-align:center}
.steps{list-style:none;margin:0;padding:4px 0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:11px 14px;font-size:15.5px;line-height:1.4;font-weight:500;position:relative}
.steps li + li::before{content:"";position:absolute;left:52px;right:0;top:0;height:1px;background:var(--line)}
.steps li::after{content:counter(s);order:-1;flex:0 0 26px;height:26px;border-radius:50%;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;background:var(--c)}
.facewrap{display:flex;flex-direction:column;align-items:center;padding:14px 10px}
.facewrap .sv{width:200px;height:auto}
.facewrap b{font-size:14.5px;font-weight:700;margin-top:6px;text-align:center}
.legend{display:flex;justify-content:center;gap:14px;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
ul.tips{margin:0;padding:12px 16px 12px 34px;font-size:15px;line-height:1.5;font-weight:500;color:var(--body)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;font-weight:700;font-size:16px}
.btn.pri{background:var(--gr);color:#fff}
.btn.mut{background:rgba(118,118,128,.16);color:var(--ink)}
.btn.blue{background:var(--pm2);color:#fff}
.btn:active{transform:scale(.98)}
.mine{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:16px;background:var(--surf);font-weight:600;font-size:15px;margin:14px 0 10px;cursor:pointer;color:var(--acc)}
.mine input{display:none}
/* guided mode */
.focus{position:fixed;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.85,.25,1), visibility 0s .38s;visibility:hidden}
.focus.on{transform:none;visibility:visible;transition:transform .38s cubic-bezier(.2,.85,.25,1)}
.fhd{padding:calc(12px + var(--safe-t)) 16px 8px;display:flex;align-items:center;gap:12px;max-width:560px;width:100%;margin:0 auto}
.bars{display:flex;gap:4px}
.bars i{flex:1;height:5px;border-radius:3px;background:rgba(118,118,128,.22);transition:background .3s}
.bars i.d{background:var(--gr)} .bars i.c{background:var(--c)}
.fcount{font-size:12.5px;font-weight:700;color:var(--muted);text-align:center;padding-top:6px}
.fbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 20px;max-width:560px;width:100%;margin:0 auto}
.fft{padding:10px 16px calc(12px + var(--safe-b));display:flex;gap:10px;max-width:560px;width:100%;margin:0 auto;border-top:1px solid var(--line)}
.fft .btn.mut{flex:0 0 100px}
.fin{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:68vh;gap:10px}
.fin .big{width:112px;height:112px;border-radius:50%;background:var(--gr);display:flex;align-items:center;justify-content:center;animation:pop .55s cubic-bezier(.2,1.6,.4,1);box-shadow:0 12px 30px rgba(22,163,74,.35)}
.fin h2{font-size:29px;font-weight:800;margin-top:12px}
.fin p{font-size:16px;color:var(--body);margin:0 24px;font-weight:500;line-height:1.45}
.fin .pillx{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-weight:800;font-size:15px;padding:9px 16px;border-radius:999px;background:var(--surf);box-shadow:var(--shadow)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* waits + context */
.wt{display:inline-flex;align-items:center;gap:3px;color:var(--acc);font-weight:700;font-style:normal}
.then{display:flex;gap:12px;align-items:flex-start;background:var(--pmt);border-radius:18px;padding:14px 16px;margin:14px 0 4px}
.then svg{flex:none;margin-top:2px;color:var(--acc)}
.then b{display:block;font-size:16px;font-weight:800}
.then p{margin:3px 0 0;font-size:14.5px;line-height:1.45;color:var(--body);font-weight:500}
.then small{display:block;margin-top:6px;font-size:13px;font-weight:700;color:var(--acc)}
.ctx{background:var(--amt);color:var(--amd)}
.timer{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:64vh;gap:6px;padding:0 8px}
.tr{position:relative;width:230px;height:230px;margin-bottom:10px}
.tr .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#tnum{font-family:var(--disp);font-size:58px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:1}
.tr .c small{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.timer h2{font-size:22px;font-weight:800}
.timer p{margin:0;font-size:15.5px;line-height:1.45;color:var(--body);font-weight:500;max-width:340px}
.timer .nx{margin-top:14px;display:flex;align-items:center;gap:10px;background:var(--surf);border-radius:16px;padding:8px 14px 8px 8px;box-shadow:var(--shadow);text-align:left}
.timer .nx .th{flex:0 0 40px;width:40px;height:40px;border-radius:11px}
.timer .nx small{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.timer .nx b{font-size:14.5px;font-weight:700}
.tbtn{flex:none;display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;color:var(--pmd);background:var(--pmt);padding:7px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.am-c .tbtn{color:var(--amd);background:var(--amt)}
.tbtn:active{transform:scale(.94)}
.then .go{display:inline-flex;align-items:center;gap:6px;margin-top:10px;background:var(--pm2);color:#fff;font-weight:700;font-size:14.5px;padding:9px 14px;border-radius:12px}
#tov{z-index:26}
.howcard{background:var(--surf);border-radius:22px;box-shadow:var(--shadow);padding:14px 14px 14px;display:flex;flex-direction:column;align-items:center}
.anim{width:100%;display:flex;justify-content:center;background:linear-gradient(180deg,var(--surf2),transparent);border-radius:16px;padding:8px 0 0}
.anim svg{width:210px;height:auto;display:block}
.actbtn{position:relative;overflow:hidden;width:100%;margin-top:12px;padding:14px;border-radius:14px;background:var(--c);color:#fff;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.actbtn .abar{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.28);transition:width .2s linear}
.actbtn span{position:relative}
.fhead{display:flex;align-items:center;gap:12px;padding:6px 2px 12px}
.fhead .th{flex:0 0 60px;width:60px;height:60px;border-radius:16px}
.fhead .it small{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.fhead .it b{font-size:19px;font-weight:800;font-family:var(--disp)}
.fhead .it span{font-size:14px;font-weight:600}
/* history */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surf);border-radius:20px;padding:14px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--disp);font-weight:800;font-size:28px;line-height:1.05}
.stat span{font-size:12px;font-weight:600;color:var(--muted)}
.badges{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:10px;scrollbar-width:none}
.badges::-webkit-scrollbar{display:none}
.badge{flex:0 0 70px;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted)}
.badge .b{width:58px;height:58px;margin:0 auto 5px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surf);box-shadow:var(--shadow)}
.badge.got{color:var(--ink)} .badge.got .b{background:linear-gradient(145deg,var(--am1),var(--am2))}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead h3{font-size:17px;font-weight:700;margin:0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1/1.1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:14px;position:relative}
.day.out{visibility:hidden}
.day.fut{color:var(--body)}
.nt{font-style:normal;font-size:9.5px;font-weight:800;color:#fff;border-radius:5px;padding:1px 4px;line-height:1.25}
.newp{position:absolute;top:2px;right:3px;line-height:0}
.day.today{box-shadow:inset 0 0 0 2px var(--acc)}
.day.both{background:var(--grt)}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(118,118,128,.25)}
.dots i.a{background:var(--am2)} .dots i.p{background:var(--pm2)}
.callegend{display:flex;gap:14px;justify-content:center;font-size:12px;font-weight:600;color:var(--muted);margin-top:10px}
.callegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.callegend i.nt{width:auto;height:auto;border-radius:5px;margin-right:3px}
/* plan */
.tl{background:var(--surf);border-radius:22px;box-shadow:var(--shadow);padding:6px 16px;margin-bottom:14px}
.tlr{display:flex;gap:14px;position:relative;padding:12px 0}
.tlr::before{content:"";position:absolute;left:21px;top:56px;bottom:-12px;width:2px;background:var(--line)}
.tlr:last-child::before{display:none}
.tlw{flex:0 0 44px;height:44px;border-radius:14px;background:var(--surf2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:16px;line-height:1;color:var(--muted)}
.tlw small{font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.tlr.past .tlw{background:var(--grt);color:var(--grd)}
.tlr.cur .tlw{background:var(--pm2);color:#fff}
.tlb b{font-weight:700;font-size:15.5px;display:block;padding-top:2px}
.tlb span{font-size:14px;color:var(--body);font-weight:500;line-height:1.4}
.youhere{font-size:10.5px;font-weight:800;color:#fff;background:var(--pm2);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px;letter-spacing:.04em}
.rl{margin:0;padding-left:20px;font-size:14.5px;line-height:1.6;font-weight:500;color:var(--body)}
.exp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.exp div{background:var(--surf);border-radius:18px;padding:12px 14px;font-weight:500;font-size:14px;color:var(--body);box-shadow:var(--shadow);line-height:1.35}
.exp b{display:block;font-family:var(--disp);font-weight:800;font-size:17px;color:var(--ink);margin-bottom:2px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 14px;position:relative}
.prow + .prow::before{content:"";position:absolute;left:78px;right:0;top:0;height:1px;background:var(--line)}
.erow + .erow::before{left:14px}
.prow .it b{font-size:15px}
.prow a{font-weight:700;font-size:13.5px;color:var(--acc);background:var(--pmt);padding:7px 13px;border-radius:999px;text-decoration:none;flex:none}
/* me */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;font-weight:500;font-size:16px;position:relative;width:100%;text-align:left}
.row + .row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--line)}
.row input{border:0;background:transparent;text-align:right;color:var(--muted);font-size:16px;font-weight:500;max-width:180px;color-scheme:light dark}
.row input:focus{outline:none;color:var(--ink)}
.sw{width:51px;height:31px;border-radius:999px;background:rgba(120,120,128,.3);position:relative;transition:background .2s;flex:0 0 51px}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.sw.on{background:var(--gr)} .sw.on::after{left:22px}
.foot{font-size:13px;color:var(--muted);margin:-6px 16px 14px;line-height:1.45;font-weight:500}
.linkrow{color:var(--acc);font-weight:600}
.photos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px 16px}
.pp{text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.pp label{display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;border-radius:12px;background:var(--surf2);overflow:hidden;margin-bottom:4px;cursor:pointer}
.pp img{width:100%;height:100%;object-fit:cover}
.pp input{display:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);font-weight:600;font-size:14px;padding:11px 18px;border-radius:999px;opacity:0;transition:all .25s;z-index:45;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>

function curSeg(){

}

function weekStrip(){
  const t = todayStr(), mon = addDays(sel, -((dow(sel)+6)%7)), wk = weekOf(sel);
  let h = '<div class="week"><div class="weekhd"><div><b>'+(wk>0?"Week "+wk:"Before you start")+'</b> <span>· '+MON[parse(mon).getMonth()].slice(0,3)+' '+parse(mon).getFullYear()+'</span></div><div class="nav">'+
    (sel!==t?'<button class="ib" data-act="pick" data-d="'+t+'" aria-label="Back to today" style="width:auto;padding:0 12px;font-size:13px;font-weight:700;color:var(--acc)">Today</button>':'')+
    '<button class="ib" data-act="wk" data-n="-7" aria-label="Previous week">'+I.left+'</button><button class="ib" data-act="wk" data-n="7" aria-label="Next week">'+I.right+'</button></div></div><div class="days">';
  for(let i=0;i<7;i++){
    const s = addDays(mon,i), fut = s > t, f = fut ? 0 : frac(s), on = s === sel;
    const col = f >= 1 ? "#16A34A" : "#7C83FF";
    h += '<button class="dp'+(on?" sel":"")+(fut?" fut":"")+(s===t?" today":"")+'" '+' data-act="pick" data-d="'+s+'" aria-label="'+nice(s)+'"><small>'+DOW[parse(s).getDay()].slice(0,1)+'</small><span class="rg">'+ring(f,36,3.5,on?"rgba(255,255,255,.25)":"rgba(118,118,128,.18)",on&&f<1?"#fff":col)+parse(s).getDate()+'</span></button>';
  }

}

}

  h += '<div class="sech">Profile</div><div class="list"><label class="row">Name<input id="fName" value="'+esc(state.name)+'" autocomplete="off"></label><label class="row">Plan start<input id="fStart" type="date" value="'+state.start+'"></label></div>';
  h += '<div class="sech">Reminders</div><div class="list"><label class="row">Morning<input id="fAm" type="time" value="'+state.amTime+'"></label><label class="row">Night<input id="fPm" type="time" value="'+state.pmTime+'"></label><button class="row linkrow" data-act="ics"><span>Add reminders to Calendar</span>'+I.bell+'</button></div>';
  h += '<p class="foot">Adds daily alarms plus a monthly photo reminder to your iPhone Calendar, so they ring even when the app is closed. Tap, then <b>Add All</b>.</p>';
  h += '<div class="sech">Retinal</div><div class="list"><button class="row" data-act="fourth" aria-pressed="'+!!state.fourth+'"><span>4th night on Sundays</span><i class="sw'+(state.fourth?" on":"")+'"></i></button></div><p class="foot">From week 17, only if 3 nights a week feels completely comfortable.</p>';
  h += '<div class="sech">Progress photos</div><div class="list"><div class="photos">'+PH.map(p => '<div class="pp"><label for="ph'+p[0]+'" id="lab'+p[0]+'">'+I.cam("#A1A1AA")+'</label><input id="ph'+p[0]+'" type="file" accept="image/*" data-w="'+p[0]+'">'+p[1]+'</div>').join("")+'</div></div><p class="foot">Same window, daylight, about 9 am, bare skin. Photos stay on this phone.</p>';
  h += '<div class="sech">Backup</div><div class="list"><button class="row linkrow" data-act="export">Save a backup file</button><label class="row linkrow" for="imp" style="cursor:pointer">Restore from a backup</label><input id="imp" type="file" accept="application/json,.json" style="display:none"></div>';
  view.innerHTML = h;
  PH.forEach(p => photoGet("m"+p[0]).then(u => { if(u){ const l = $("#lab"+p[0]); if(l) l.innerHTML = '<img alt="'+p[1]+' photo" src="'+u+'">'; } }));
}

// ---------- photos (IndexedDB)
function db(){ return new Promise((res, rej) => { try{ const r = indexedDB.open("kskin-photos", 1); r.onupgradeneeded = () => r.result.createObjectStore("p"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } }); }
function photoGet(k){ return db().then(d => new Promise(res => { const q = d.transaction("p").objectStore("p").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); })).catch(() => null); }
function photoPut(k, v){ return db().then(d => new Promise(res => { const tx = d.transaction("p","readwrite"); tx.objectStore("p").put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); })).catch(() => false); }
function shrink(file, max){ return new Promise(res => { const im = new Image(); im.onload = () => { const s = Math.min(1, max/Math.max(im.width, im.height)); const c = document.createElement("canvas"); c.width = im.width*s; c.height = im.height*s; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", .82)); URL.revokeObjectURL(im.src); }; im.onerror = () => res(null); im.src = URL.createObjectURL(file); }); }
Promise.all(Object.keys(DATA.illo).map(k => photoGet("prod-"+k).then(u => { if(u) mine[k] = u; }))).then(() => { if(Object.keys(mine).length) render(); });

// ---------- reminders (.ics)
function ics(){
  const st = state.start.replace(/-/g,""), am = state.amTime.replace(":",""), pm = state.pmTime.replace(":",""), now = new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const ev = (uid, t, rule, title, desc) => ["BEGIN:VEVENT","UID:"+uid+"@myskin","DTSTAMP:"+now,"DTSTART:"+st+"T"+t+"00","DURATION:PT10M","RRULE:"+rule,"SUMMARY:"+title,"DESCRIPTION:"+desc,"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+title,"TRIGGER:PT0M","END:VALARM","END:VEVENT"].join("\r\n");
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MySkin//EN","CALSCALE:GREGORIAN",
    ev("skin-am", am, "FREQ=DAILY", "Skin: morning routine + sunscreen", "Cleanse, treat, sunscreen before the bus. Open My Skin to tick it off."),
    ev("skin-pm", pm, "FREQ=DAILY", "Skin: night routine", "Open My Skin to see if tonight is retinal, BHA or rest."),
    ev("skin-photo", "0900", "FREQ=MONTHLY;BYDAY=1SU", "Skin: monthly progress photos", "Same window, daylight, bare skin. Add them in My Skin > Me."),
    "END:VCALENDAR"].join("\r\n");
}
function download(name, text, type){
  const blob = new Blob([text], {type}); const u = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}

// ---------- confetti
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#confetti"), ctx = cv.getContext("2d"), W = cv.width = innerWidth, H = cv.height = innerHeight;
  const cols = ["#FDBA4D","#7C83FF","#16A34A","#E5489D","#F2762E"];
  const ps = Array.from({length:110}, () => ({x:W/2+(Math.random()-.5)*100, y:H*0.45, vx:(Math.random()-.5)*10, vy:-Math.random()*14-6, r:Math.random()*6+4, c:cols[Math.floor(Math.random()*5)], a:Math.random()*6}));
  let f = 0;
  (function tick(){ ctx.clearRect(0,0,W,H); ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += .2; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); }); if(++f < 120) requestAnimationFrame(tick); else ctx.clearRect(0,0,W,H); })();
}

// ---------- render + events
function render(){
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  ({today:renderToday, history:renderHistory, plan:renderPlan, me:renderMe})[tab]();
  if(sheetOpen) openSheet(sheetOpen.r, sheetOpen.id);
}
function setSel(s){ sel = s; seg = null; }
document.addEventListener("click", e => {
  const tb = e.target.closest(".tabs button"); if(tb){ tab = tb.dataset.tab; if(tab==="history") calMonth = null; render(); scrollTo(0,0); return; }
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act;
  if(a === "toggle") toggle(el.dataset.r, el.dataset.id);
  else if(a === "open") openSheet(el.dataset.r, el.dataset.id);
  else if(a === "close") closeSheet();
  else if(a === "sheetdone"){ const o = sheetOpen; closeSheet(); toggle(o.r, o.id); }
  else if(a === "seg"){ seg = el.dataset.s; render(); }
  else if(a === "pick"){ setSel(el.dataset.d); render(); }
  else if(a === "wk"){ setSel(addDays(sel, +el.dataset.n)); render(); }
  else if(a === "shave"){ const r = recFor(sel); r.shave = !r.shave; if(!r.shave) delete r.done.shave; save(); render(); }
  else if(a === "flare"){ const r = recFor(sel); r.flare = !r.flare; save(); render(); }
  else if(a === "fourth"){ state.fourth = !state.fourth; save(); render(); }
  else if(a === "mon"){ let [y,m] = calMonth; m += +el.dataset.n; if(m<0){m=11;y--;} if(m>11){m=0;y++;} calMonth = [y,m]; render(); }
  else if(a === "goto"){ setSel(el.dataset.d); tab = "today"; render(); scrollTo(0,0); }
  else if(a === "focus") openFocus(el.dataset.r);
  else if(a === "fdone"){
    const id = focus.ids[focus.i], st = DATA.steps[focus.r].find(x => x.id === id), was = !!dayRec(sel).done[id];
    setDone(focus.r, id, true);
    const info = thenInfo(focus.r, st, steps(focus.r, sel), sel);
    if(!was && info.secs > 0 && !isDone(focus.r, sel)) startWait(info); else focusNext();
  }
  else if(a === "tskip") endWait(false);
  else if(a === "timer") startSolo(el.dataset.r, el.dataset.id);
  else if(a === "atimer") startAct(el.dataset.r, el.dataset.id);
  else if(a === "sdone" || a === "sclose") endSolo(false);
  else if(a === "splus"){ if(solo){ solo.end += 60000; solo.total += 60000; tickSolo(); } }
  else if(a === "tplus"){ if(focus && focus.wait){ focus.wait.end += 60000; focus.wait.total += 60000; tickWait(); } }
  else if(a === "fskip") focusNext();
  else if(a === "fprev"){ if(focus && focus.i > 0){ focus.i--; focus.face = false; renderFocus(); } }
  else if(a === "fface"){ focus.face = true; renderFocus(); }
  else if(a === "fclose") closeFocus();
  else if(a === "ics"){ download("my-skin-reminders.ics", ics(), "text/calendar"); }
  else if(a === "export"){ download("my-skin-backup-"+todayStr()+".json", JSON.stringify(state, null, 1), "application/json"); toast("Backup saved"); }
});
$("#scrim").addEventListener("click", closeSheet);
// swipe the week strip left/right
let tx0 = null;
document.addEventListener("touchstart", e => { tx0 = e.target.closest(".week") ? [e.touches[0].clientX, e.touches[0].clientY] : null; }, {passive:true});
document.addEventListener("touchend", e => { if(!tx0) return; const dx = e.changedTouches[0].clientX - tx0[0], dy = e.changedTouches[0].clientY - tx0[1]; tx0 = null;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.5){ setSel(addDays(sel, dx < 0 ? 7 : -7)); render(); } }, {passive:true});
document.addEventListener("change", async e => {
  const t = e.target;
  if(t.id === "fName"){ state.name = t.value.trim() || "Kunjal"; save(); }
  else if(t.id === "fStart" && t.value){ state.start = t.value; save(); toast("Start date updated"); }
  else if(t.id === "fAm" && t.value){ state.amTime = t.value; save(); }
  else if(t.id === "fPm" && t.value){ state.pmTime = t.value; save(); }
  else if(t.dataset && t.dataset.w && t.files && t.files[0]){ const u = await shrink(t.files[0], 900); if(u){ await photoPut("m"+t.dataset.w, u); toast("Photo saved"); renderMe(); } }
  else if(t.dataset && t.dataset.pk && t.files && t.files[0]){ const u = await shrink(t.files[0], 500); if(u){ mine[t.dataset.pk] = u; await photoPut("prod-"+t.dataset.pk, u); toast("Product photo saved"); render(); } }
  else if(t.id === "imp" && t.files && t.files[0]){ try{ const o = JSON.parse(await t.files[0].text()); if(o && o.days){ state = Object.assign({}, DEFAULTS, o); save(); toast("Backup restored"); render(); } else toast("That file isn't a My Skin backup"); }catch(err){ toast("Couldn't read that file"); } }
});
document.addEventListener("keydown", e => { if(e.key === "Escape"){ if(focus) closeFocus(); else if(sheetOpen) closeSheet(); } });
let lastToday = todayStr();
document.addEventListener("visibilitychange", () => { if(!document.hidden){ tickSolo(); tickWait(); const t = todayStr(); if(sel === lastToday) setSel(t); lastToday = t; if(!focus) render(); } });
render();
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
